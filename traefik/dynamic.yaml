http:
  routers:
    landing:
      rule: Host(`localhost`) || Host(`127.0.0.1`)
      entryPoints: [websecure]
      service: landing
      tls: {}
  services:
    landing:
      loadBalancer:
        servers:
          - url: http://landing:3000

tls:
  certificates:
    - certFile: /certs/localhost.crt
      keyFile: /certs/localhost.key
  options:
    default:
      minVersion: VersionTLS13
      maxVersion: VersionTLS13
